name: Build desktop release

# Build macOS (x64 + arm64) and Windows (x64) installers on git tag push,
# then attach the artifacts to a GitHub Release.
#
# Trigger with:
#   git tag v0.1.0 && git push origin v0.1.0
#
# Requires no extra secrets for unsigned builds. For signed/notarized macOS
# builds add APPLE_ID / APPLE_APP_SPECIFIC_PASSWORD / CSC_LINK / CSC_KEY_PASSWORD
# secrets and uncomment the notarize block below.

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    # IMPORTANT: macOS is split into TWO jobs on DIFFERENT runners because
    # `ffmpeg-static`'s postinstall only downloads the binary for the runner's
    # current arch. Building both x64 and arm64 from one runner would embed
    # the wrong ffmpeg into the other-arch dmg (confirmed: Intel Mac + arm64
    # ffmpeg → "bad CPU type in executable" → TTS fails silently).
    # macos-13 is the last Intel x64 runner; macos-14+ are Apple Silicon.
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-13          # Intel Mac runner for x64 dmg
            name: macos-x64
            pkgCmd: --mac --x64
          - os: macos-14          # Apple Silicon runner for arm64 dmg
            name: macos-arm64
            pkgCmd: --mac --arm64
          - os: windows-latest
            name: windows
            pkgCmd: --win --x64

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install deps
        run: npm ci

      - name: Verify ffmpeg-static arch (debug)
        if: startsWith(matrix.name, 'macos')
        run: |
          file node_modules/ffmpeg-static/ffmpeg || true
          node_modules/ffmpeg-static/ffmpeg -version 2>&1 | head -1 || true

      - name: Build frontend
        run: npm run build

      - name: Package
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Signing/notarization (opt-in) — populate these secrets and uncomment
          # CSC_LINK to enable. Unsigned dmg/exe still works, users just see
          # Gatekeeper / SmartScreen prompts on first launch.
          # CSC_LINK: ${{ secrets.CSC_LINK }}
          # CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          # APPLE_ID: ${{ secrets.APPLE_ID }}
          # APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
        run: npx electron-builder ${{ matrix.pkgCmd }} --publish never

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dnd-dm-${{ matrix.name }}
          path: |
            release/*.dmg
            release/*.exe
            release/*.blockmap
            release/latest*.yml
          if-no-files-found: ignore

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/**/*.dmg
            artifacts/**/*.exe
            artifacts/**/*.blockmap
            artifacts/**/latest*.yml
          draft: false
          prerelease: false
          generate_release_notes: true
